<!DOCTYPE html>
<html lang='en'>
  <head>
    <meta charset='UTF-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0' />
    <title>You're Offline - SlateMP</title>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css' />
    <link rel='preconnect' href='https://fonts.googleapis.com'>
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
    <link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Rubik+Mono+One&display=swap' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&display=swap' rel='stylesheet'>
    <link rel='stylesheet' href='style.css' />
    <style>
      .offline-wrap {
        align-items: center;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-left: auto;
        margin-right: auto;
        max-width: 100vw;
        min-height: 100vh;
        justify-content: center;
        text-align: center;
        width: 100%;
      }

      .offline-logo {
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: oceanFlow 10s ease infinite;
        background: linear-gradient(
          135deg,
          var(--text-deep-muted) 0%,
          var(--text-deep-muted) 35%,
          var(--text-muted) 50%,
          var(--text-deep-muted) 65%,
          var(--text-deep-muted) 100%
        );
        background-clip: text;
        background-size: 400% 100%;
        display: inline-block;
        font-family: 'Rubik Mono One', sans-serif;
        font-size: 5.1rem;
        letter-spacing: -14px;
        line-height: 1;
        margin-left: -14px;
        overflow: visible;
        padding-right: 14px;
        transition: var(--default-transition);
        user-select: none;
      }

      .offline-title {
        color: var(--text-bright);
        font-size: 2.15rem;
        font-weight: 700;
        letter-spacing: 1.1px;
        margin: 12px 0 0;
        transition: var(--default-transition);
      }
    </style>
  </head>
  <body>
    <div class='offline-wrap has-glow'>
      <div class='offline-logo'>&lt;/&gt;</div>
      <h2 class='offline-title' id='offline-title'>You Are Offline</h2>
    </div>

    <script>
      window.addEventListener('online', () => {
        document.getElementById('offline-title').textContent = 'Back Online, Reloading...';
        setTimeout(() => window.location.reload(), 400);
      });
    </script>
  </body>
</html>
