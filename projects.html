<!DOCTYPE html>
<html lang='en'>
  <head>
    <meta charset='UTF-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0' />
    <title>Projects</title>
    <!-- | METADATA | page:projects -->
    <link rel='preconnect' href='https://cdnjs.cloudflare.com' crossorigin>
    <link rel='preconnect' href='https://fonts.googleapis.com'crossorigin>
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
    <link rel='preconnect' href='https://cdn.jsdelivr.net' crossorigin>
    <link rel='preconnect' href='https://code.iconify.design' crossorigin>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css' integrity='sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==' crossorigin='anonymous' referrerpolicy='no-referrer' />
    <link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Rubik+Mono+One&family=Ubuntu:wght@400;500;600;700&display=swap' rel='stylesheet'>
    <link rel='stylesheet' href='style.css' />
  </head>
  <body>
    <nav class='navbar navbar-keep has-glow'>
      <div class='nav-profile' id='nav-profile'>
        <div class='nav-name' id='nav-user-name'>Loading...</div>
        <div class='nav-role' id='nav-user-role'></div>
      </div>
      <div class='nav-links' id='nav-items'>
        <div class='filter-wrapper'>
          <a id='filter-btn'>
            <i class='fa-solid fa-filter'></i>
            <span class='nav-label'>Filter</span>
          </a>
          <span class='post-detail filter-mobile' id='filter-mobile'></span>
        </div>
        <div class='search-wrapper'>
          <i class='fa-solid fa-magnifying-glass search-icon'></i>
          <input type='text' id='project-search-input' placeholder='Search' autocomplete='off' maxlength='50'/>
          <button class='btn' id='nav-share-icon'>
          <i class='fa-solid fa-arrow-up-from-bracket share-icon share-icon-upload'></i>
          <i class='fa-solid fa-check share-icon share-icon-check'></i>
        </button>
        </div>
        <a href='/'>
          <i class='fa-solid fa-house'></i>
          <span class='nav-label'>Home</span>
        </a>
      </div>
    </nav>
    <div class='menu-panel' id='menu-panel'>
      <div class='menu-header'>
        <p>Filter By Domain</p>
        <i class='fa-solid fa-filter-circle-xmark' id='cancel-filter-icon'></i>
      </div>
      <div class='filter-dropdown' id='filter-dropdown'></div>
    </div>
    <section class='hero' id='latest-hero'>
      <div class='hero-card' id='latest-hero-card'>
        <div class='latest-meta'>
          <span class='keyword keyword-big'>Latest Project</span>
          <span class='star-icon' id='latest-star'></span>
        </div>
        <h1 id='latest-title'></h1>
        <div class='subtitle' id='latest-subtitle'></div>
        <span class='latest-keywords-container' id='latest-keywords-container'></span>
        <button class='action-btn' id='isolate-latest-btn'><i class='fa-solid fa-check-to-slot'></i><span>Isolate</span></button>
      </div>
    </section>
    <main class='container' id='projects-container'>
      <div class='list-container' id='list-container'></div>
    </main>

    <script src='https://cdn.jsdelivr.net/npm/marked/marked.min.js' defer></script>
    <script src='https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js' defer></script>
    <script src='base.js' defer></script>
    <script src='chat.js' defer></script>
    <script src='projects.js' defer></script>
  </body>
</html>
