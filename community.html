<!DOCTYPE html>
<html lang='en'>
  <head>
    <meta charset='UTF-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0' />
    <title>Community</title>
    <!-- | METADATA | page:community -->
    <link rel='preconnect' href='https://cdnjs.cloudflare.com' crossorigin>
    <link rel='preconnect' href='https://fonts.googleapis.com'crossorigin>
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
    <link rel='preconnect' href='https://cdn.jsdelivr.net' crossorigin>
    <link rel='preconnect' href='https://code.iconify.design' crossorigin>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css' integrity='sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==' crossorigin='anonymous' referrerpolicy='no-referrer' />
    <link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Rubik+Mono+One&family=Ubuntu:wght@400;500;600;700&display=swap' rel='stylesheet'>
    <link rel='stylesheet' href='style.css' />
  </head>
  <body>
    <nav class='navbar navbar-keep has-glow'>
      <div class='nav-profile'>
        <div class='nav-name' id='nav-user-name'>Loading...</div>
        <div class='nav-role' id='nav-user-role'></div>
      </div>
      <div class='nav-links' id='hub-tab-home'>
        <a class='hub-tab' id='hub-tab-feed'>
          <i class='fa-solid fa-user'></i>
          <span class='nav-label'>Feed</span>
        </a>
        <a class='hub-tab' id='hub-tab-guests'>
          <i class='fa-solid fa-user-group'></i>
          <span class='nav-label'>Guests</span>
        </a>
        <a class='hub-tab' id='hub-tab-faq'>
          <i class='fa-solid fa-circle-question'></i>
          <span class='nav-label'>FAQ</span>
        </a>
        <div class='search-wrapper' id='hub-search-wrapper'>
          <i class='fa-solid fa-magnifying-glass search-icon'></i>
          <input type='text' id='hub-search-input' placeholder='Search' autocomplete='off' maxlength='100'/>
          <button class='btn' id='nav-share-icon'>
            <i class='fa-solid fa-arrow-up-from-bracket share-icon share-icon-upload'></i>
            <i class='fa-solid fa-check share-icon share-icon-check'></i>
          </button>
        </div>
        <a id='hub-tab-home' href='/'>
          <i class='fa-solid fa-house'></i>
          <span class='nav-label'>Home</span>
        </a>
      </div>
    </nav>
    <main class='hub-main'>
      <div class='floating-trigger has-glow feed-action-trigger' id='modal-trigger'>
        <i class='fa-brands fa-google'></i>
      </div>
      <div class='container' id='hub-panel'>
        <div class='list-container' id='list-container'></div>
      </div>
    </main>
    <div class='feed-modal-overlay' id='feed-modal-overlay'>
      <div class='feed-modal' id='feed-modal'>
        <div id='feed-modal-inner'></div>
      </div>
    </div>
    <script src='https://cdn.jsdelivr.net/npm/marked/marked.min.js' defer></script>
    <script src='https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js' defer></script>
    <script src='base.js' defer></script>
    <script src='communityUtils.js' defer></script>
    <script src='communityGB.js' defer></script>
    <script src='community.js' defer></script>
  </body>
</html>
