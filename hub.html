<!DOCTYPE html>
<html lang='en'>
  <head>
    <meta charset='UTF-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0' />
    <title>Hub</title>
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css' />
    <link rel='preconnect' href='https://fonts.googleapis.com'>
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
    <link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Rubik+Mono+One&display=swap' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;600;700&display=swap' rel='stylesheet'>
    <link rel='stylesheet' href='style.css' />
  </head>
  <body>
    <nav class='navbar has-glow'>
      <div class='nav-profile'>
        <div class='nav-name' id='nav-user-name'>Loading...</div>
        <div class='nav-role' id='nav-user-role'></div>
      </div>
      <div class='nav-links'>
        <a href='index.html'>
          <i class='fa-solid fa-house'></i>
          <span class='nav-label'>Home</span>
        </a>
        <a class='hub-tab active' id='hub-tab-feed'>
          <i class='fa-solid fa-user'></i>
          <span class='nav-label'>Feed</span>
        </a>
        <a class='hub-tab' id='hub-tab-guests'>
          <i class='fa-solid fa-user-group'></i>
          <span class='nav-label'>Guests</span>
        </a>
        <a class='hub-tab' id='hub-tab-faq'>
          <i class='fa-solid fa-circle-question'></i>
          <span class='nav-label'>FAQ</span>
        </a>
        <div class='search-wrapper' id='hub-search-wrapper'>
          <i class='fa-solid fa-magnifying-glass search-icon'></i>
          <input type='text' id='hub-search-input' placeholder='Search' autocomplete='off' maxlength='100'/>
        </div>
        <button class='btn' id='nav-share-icon'><i class='fa-solid fa-link share-icon'></i></button>
      </div>
    </nav>
    <main class='hub-main'>
      <div class='floating-trigger has-glow feed-action-trigger' id='modal-trigger'><i class='fa-brands fa-google'></i>  </div>
      <div class='container'            id='hub-panel-feed'>   <div id='feed-container'></div>   </div>
      <div class='container hub-hidden' id='hub-panel-guests'> <div id='guests-container'></div> </div>
      <div class='container hub-hidden' id='hub-panel-faq'>    <div id='list-container'></div>   </div>
    </main>
    <div class='feed-modal-overlay' id='feed-modal-overlay'>
      <div class='feed-footer' id='feed-footer'>
        <div id='feed-footer-inner'></div>
      </div>
    </div>
    <script src='https://cdn.jsdelivr.net/npm/marked/marked.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js'></script>
    <script src='base.js'></script>
    <script src='hubUtils.js'></script>
    <script src='hub.js'></script>
  </body>
</html>
